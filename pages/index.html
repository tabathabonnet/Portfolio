<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabatha — Interactive Media Designer</title>
<meta name="description" content="Portfolio de Tabatha — photographie, illustration, vidéo et graphisme.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

{{header:home}}

<main>

  <section class="hero wrap">
    <div class="grid-12">
      <h1 class="hero-title">{{home_title}}</h1>
      <p class="hero-meta">{{home_intro}}</p>
      <div class="hero-disciplines">
{{home_chips}}
      </div>
    </div>
  </section>

  <section class="work-index wrap" aria-label="Travaux sélectionnés">
    <div class="grid-12">
      <span class="eyebrow" style="grid-column: 1 / 13;">Travaux sélectionnés</span>
    </div>

{{work_index}}

    <div class="hover-preview"><img src="" alt=""></div>
  </section>

</main>

{{footer}}
