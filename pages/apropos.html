<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>À propos — Tabatha</title>
<meta name="description" content="À propos de Tabatha, interactive media designer — parcours et contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

{{header:about}}

<main>

  <section class="about-hero wrap">
    <div class="grid-12">
      <h1 class="about-title">{{about_title}}</h1>
      <div class="about-photo"><img src="{{about_photo}}" alt="Portrait de Tabatha" style="width:100%;height:100%;object-fit:cover;"></div>
      <div class="about-text">
{{about_text}}
      </div>
    </div>
  </section>

  <section class="skills-list wrap">
    <div class="grid-12">
{{about_columns}}
    </div>
  </section>

  <section class="contact-block wrap" id="contact">
    <div class="grid-12">
      <h2 class="contact-title">{{contact_title}}</h2>
      <span class="eyebrow" style="grid-column:1/13;">{{contact_intro}}</span>
    </div>

    <div class="grid-12" style="margin-top: 32px;">
      <div class="contact-links">
{{contact_links}}
      </div>
    </div>
  </section>

</main>

{{footer}}
