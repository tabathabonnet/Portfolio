<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>À propos — Tabatha</title>
<meta name="description" content="À propos de Tabatha, interactive media designer — parcours et contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

{{header:about}}

<main>

  <section class="about-hero wrap">
    <div class="grid-12">
      <h1 class="about-title">{{about_title}}</h1>
      <div class="about-photo"><img src="{{about_photo}}" alt="Portrait de Tabatha" style="width:100%;height:100%;object-fit:cover;"></div>
      <div class="about-text">
{{about_text}}
      </div>
    </div>
  </section>

  <section class="skills-list wrap">
    <div class="grid-12">
{{about_columns}}
    </div>
  </section>

  <section class="contact-block wrap" id="contact">
    <div class="grid-12">
      <h2 class="contact-title">{{contact_title}}</h2>
      <span class="eyebrow" style="grid-column:1/13;">{{contact_intro}}</span>
    </div>

    <div class="grid-12" style="margin-top: 32px;">
      <!--
        Formulaire prêt pour Netlify Forms (gratuit, sans backend) :
        - garder name="contact" et l'attribut data-netlify="true"
        - le champ caché form-name est requis par Netlify
        - le champ "bot-field" est un piège à spam, à laisser vide
        Si tu héberges ailleurs, remplace l'attribut action par un
        service comme Formspree (gratuit jusqu'à 50 envois/mois).
      -->
      <form class="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="contact">
        <p style="display:none;"><label>Ne pas remplir : <input name="bot-field"></label></p>

        <div class="field">
          <label for="name">Nom</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button class="submit-btn" type="submit">Envoyer</button>
      </form>

      <div class="contact-links">
        <a href="mailto:{{email}}">{{email}}</a>
        <a href="{{instagram}}">Instagram</a>
        <a href="{{linkedin}}">LinkedIn</a>
        <a href="{{behance}}">Behance</a>
      </div>
    </div>
  </section>

</main>

{{footer}}
